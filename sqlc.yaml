version: "2"
sql:
  - engine: postgresql
    schema: app/admin/service/schema.sql
    queries: app/admin/service/internal/data/quotasql/queries
    gen:
      go:
        package: quotasql
        out: app/admin/service/internal/data/quotasql
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          - db_type: timestamptz
            go_type:
              import: time
              type: Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
