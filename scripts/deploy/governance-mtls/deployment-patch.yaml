# Strategic merge patch: preserve image, Network and other settings.
# (The ANI_MODEL_* env and model-trust volume were removed when the model
# integration was detached on 2026-09-21; re-add them when re-wiring model.)
spec:
  template:
    spec:
      containers:
        - name: governance
          volumeMounts:
            - name: service-identity
              mountPath: /service-identity
              readOnly: true
      volumes:
        - name: service-identity
          secret:
            secretName: governance-client-tls
