fullnameOverride: redis
image:
  repository: docker.changqingyun.cn/mirror/redis
  tag: 7-alpine
  pullPolicy: IfNotPresent
existingSecret: ani-governance-redis
passwordKey: password
service:
  port: 6379
persistence:
  enabled: true
  # Empty lets Kubernetes select the cluster's default StorageClass.
  storageClass: ""
  size: 2Gi
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi
