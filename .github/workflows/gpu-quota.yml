name: GPU quota data gate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quota-ent:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16.10
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      GOWORK: "off"
      GOMAXPROCS: "2"
      GOFLAGS: "-p=2"
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      QUOTA_LAB_PG_DSN: postgres://gov_acc_runtime@127.0.0.1:5432/gov_acc_data?sslmode=disable
      QUOTA_LAB_REGRESSION_DSN: postgres://gov_acc_runtime@127.0.0.1:5432/gov_acc_lab?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned generators and audit tools
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Explicit migration and restricted runtime role
        run: bash scripts/ci-quota-pg.sh
      - name: Explicit isolated legacy lab certificates
        run: |
          bash scripts/accelerator-acceptance/prepare-lab-certs.sh "$RUNNER_TEMP/quota-lab"
          echo "QUOTA_LAB_CERTS_DIR=$RUNNER_TEMP/quota-lab/certs" >> "$GITHUB_ENV"
          echo 'QUOTA_LAB_PG_ADMIN_DSN=postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable' >> "$GITHUB_ENV"
      - name: Ent generation, source, PG, tenancy, and race gates
        run: |
          mkdir -p "$RUNNER_TEMP/quota-evidence"
          {
            git rev-parse HEAD
            git status --porcelain
            go version
            psql -X -At -d postgres -c 'SELECT version()'
            printf '%s\n' 'command: make verify-gpu'
            date -u +%FT%TZ
          } > "$RUNNER_TEMP/quota-evidence/environment.txt"
          git ls-files -z | xargs -0 sha256sum > "$RUNNER_TEMP/quota-evidence/source.sha256"
          set +e
          make verify-gpu 2>&1 | tee "$RUNNER_TEMP/quota-evidence/verify.log"
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > "$RUNNER_TEMP/quota-evidence/verify.exit"
          date -u +%FT%TZ > "$RUNNER_TEMP/quota-evidence/finished.txt"
          exit "$status"
      - name: Preserve verification evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quota-ent-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quota-evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: Coverage boundary
        run: echo 'This job proves the quota data slice only. Cross-repository mTLS BFF, durable test owner, and provider replay require the separate GOV-ACC-V12-01 joint assembly.'
