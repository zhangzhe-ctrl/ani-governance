version: v2
clean: false
managed:
  enabled: true
  disable:
    - module: buf.build/googleapis/googleapis
    - module: buf.build/gnostic/gnostic
  override:
    - file_option: go_package_prefix
      value: go-wind-admin/api/gen/go
    - file_option: go_package
      path: admin/service/v1
      value: go-wind-admin/api/gen/go/admin/service/v1;adminpb
    - file_option: go_package
      path: identity/service/v1
      value: go-wind-admin/api/gen/go/identity/service/v1;identitypb
    - file_option: go_package
      path: quota/service/v1
      value: go-wind-admin/api/gen/go/quota/service/v1;quotapb

    # 本地化分页 Proto（api/localdeps/pagination，源码与 go-crud/api@v0.0.7 逐字节一致）。
    # managed 全局前缀 go-wind-admin/api/gen/go 对此 Proto 例外：生成到 pkg/localdeps 目标，
    # Go 包名保持上游生成物的 v1（原 option go_package 的 ;pagination 别名在上游生成物中
    # 已被 go_package_prefix 抹去，这里复刻既有行为，不改变协议）。
    - file_option: go_package
      path: pagination/v1
      value: go-wind-admin/pkg/localdeps/go-crud/api/gen/go/pagination/v1
inputs:
  - directory: protos
    paths:
      - protos/admin/service/v1/i_accelerator.proto
      - protos/catalog/service/v1/accelerator.proto
      - protos/identity/service/v1/module.proto
      - protos/quota/service/v1/quota_catalog.proto
plugins:
  - local: [go, run, google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11]
    out: gen/go
    opt: paths=source_relative
  - local: [go, run, google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.0]
    out: gen/go
    opt: paths=source_relative
  - local: [go, run, github.com/go-kratos/kratos/cmd/protoc-gen-go-http/v2@v2.0.0-20251205160234-b9fab9a5a5ab]
    out: gen/go
    opt: paths=source_relative
