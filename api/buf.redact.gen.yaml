# 本地化脱敏 Proto 的专用生成模板（T09）。
#
# 只生成 api/localdeps/redact 这一个模块，输出到
# pkg/localdeps/go-wind-toolkit/protoc-gen-go-redact，与业务模板（inputs 只选 protos）
# 互不重叠：redact/v1/redact.pb.go 在全仓只生成这一份，不会在 api/gen/go/redact 出现副本。
# clean:false：该目录另有手写的 interface.go 与 stream.go，禁止被 clean 删除；
# 生成后由 scripts/generate-redact.sh 按固定清单核对落点。
# Go 包名保持归档生成物的 redact；逻辑 import 路径 redact/v1/redact.proto 不变。
#
# 下面的 file_option disable 为协议等价所必需：buf 的 managed 模式在改写 Proto 的
# go_package 时，会顺带按 proto package 生成 java/objc/csharp/php 默认选项。
# protoc-gen-go-redact 归档里的 redact.pb.go 由上游另一条工具链产出，没有这些选项，
# 若不显式关闭，本地重新生成的文件描述符就会比锁定基线多出协议层的变化。
# 关闭后与归档生成物的差异只剩 go_package 字符串本身（见 T09-descriptor-*.txt）。
# 该 disable 只作用于本模板（仅覆盖 localdeps/redact 一个模块），
# 业务模板保持原样，不改动任何已存在的其他 Proto 描述符。
version: v2
clean: false
managed:
  enabled: true
  disable:
    - module: buf.build/googleapis/googleapis
    - file_option: java_package
    - file_option: java_multiple_files
    - file_option: java_outer_classname
    - file_option: objc_class_prefix
    - file_option: csharp_namespace
    - file_option: php_namespace
    - file_option: php_metadata_namespace
    - file_option: ruby_package
  override:
    - file_option: go_package_prefix
      value: go-wind-admin/api/gen/go
    - file_option: go_package
      path: redact/v1
      value: go-wind-admin/pkg/localdeps/go-wind-toolkit/protoc-gen-go-redact/redact/v1;redact
inputs:
  - directory: localdeps/redact
plugins:
  - local: [go, run, google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11]
    out: ../pkg/localdeps/go-wind-toolkit/protoc-gen-go-redact
    opt: paths=source_relative
