syntax = "proto3";

package admin.service.v1;

import "gnostic/openapi/v3/annotations.proto";

option (gnostic.openapi.v3.document) = {
  info: {
    title: "GoWind Admin API";
    version: "1.0";
    description: "GoWind Admin API";
    contact: {
      name: "tx7do";
      url: "https://github.com/tx7do/go-wind-admin";
      email: "yanglinbo@gmail.com";
    }
    license: {
      name: "MIT License";
      url: "https://github.com/tx7do/go-wind-admin/blob/master/LICENSE";
    }
  }

  security: [
    {
      additional_properties: [
        {
          name: "OAuth2PasswordBearer"; value: {}
        }
      ]
    }
  ]

  components: {
    security_schemes: {
      additional_properties: [
        { name: "BearerAuth" value: { security_scheme: { type: "http" scheme: "bearer" bearer_format: "JWT" description: "User JWT" } } },
        { name: "AccessKeyAuth" value: { security_scheme: { type: "apiKey" name: "X-Access-Key" in: "header" description: "Public AK; all three signature headers are required together" } } },
        { name: "SignatureAuth" value: { security_scheme: { type: "apiKey" name: "X-Signature" in: "header" description: "ANI seven-line HMAC-SHA256, lowercase hex; Swagger does not calculate it" } } },
        { name: "SignatureTime" value: { security_scheme: { type: "apiKey" name: "X-Timestamp" in: "header" description: "Positive Unix seconds within 300 seconds of server time" } } },
        {
          name: "OAuth2PasswordBearer";
          value: {
            security_scheme: {
              type: "oauth2";
              flows: {
                password: {
                  // OAuth2 password flow 只能表达单一 token 端点，取租户登录端点。
                  // 平台登录为独立端点 /api/v1/auth/platform/password/login，
                  // OAuth2 password flow 无法表达，仅在本文件注释中说明。
                  token_url: "/api/v1/auth/password/login";
                  refresh_url: "/api/v1/auth/refresh";
                  scopes: {}
                }
              }
            }
          }
        }
      ]
    }

    schemas: {
      additional_properties: [
        {
          name: "KratosStatus";
          value: {
            schema: {
              type: "object"
              description: "Kratos错误返回"
              properties: {
                additional_properties: [
                  {
                    name: "code"
                    value: {
                      schema: {
                        type: "number"
                        format: "int32"
                        description: "错误码"
                      }
                    }
                  },
                  {
                    name: "message"
                    value: {
                      schema: {
                        type: "string"
                        description: "错误消息"
                      }
                    }
                  },
                  {
                    name: "reason"
                    value: {
                      schema: {
                        type: "string"
                        description: "错误原因"
                      }
                    }
                  },
                  {
                    name: "metadata"
                    value: {
                      schema: {
                        type: "object"
                        description: "元数据"
                      }
                    }
                  }
                ]
              }
            }
          }
        }
      ]
    }

    responses: {
      additional_properties: [
        {
          name: "default"
          value: {
            response: {
              description: "default kratos response"
              content: {
                additional_properties: [
                  {
                    name: "application/json"
                    value: {
                      schema: {
                        reference: {
                          _ref: "#/components/schemas/KratosStatus"
                        }
                      }
                    }
                  }
                ]
              }
            }
          }
        }

        //        {
        //          name: "500"
        //          value: {
        //            response: {
        //              description: "default kratos response"
        //              content: {
        //                additional_properties: [
        //                  {
        //                    name: "application/json"
        //                    value: {
        //                      schema: {
        //                        reference: {
        //                          _ref: "#/components/schemas/KratosStatus"
        //                        }
        //                      }
        //                    }
        //                  }
        //                ]
        //              }
        //            }
        //          }
        //        }
      ]
    }
  }
};
