syntax = "proto3";
package admin.service.v1;

import "google/api/annotations.proto";
import "gnostic/openapi/v3/annotations.proto";
import "sandbox/service/v1/sandbox.proto";

service SandboxService {
  rpc ExecSandbox(sandbox.service.v1.ExecSandboxRequest) returns (sandbox.service.v1.ExecSandboxResponse) {
    option (google.api.http) = { post: "/api/v1/sandbox/{data.sandbox_id}/exec" body: "*" };
  }
  rpc OpenSandboxPreview(sandbox.service.v1.OpenSandboxPreviewRequest) returns (sandbox.service.v1.SandboxPreviewAcceptance) {
    option (google.api.http) = { post: "/api/v1/sandbox/{data.sandbox_id}/ports" body: "*" };
  }
  rpc CloseSandboxPreview(sandbox.service.v1.CloseSandboxPreviewRequest) returns (sandbox.service.v1.SandboxPreviewAcceptance) {
    option (google.api.http) = { post: "/api/v1/sandbox/{data.sandbox_id}/ports/{data.preview_id}:close" body: "*" };
  }
  rpc ListSandboxPreviews(sandbox.service.v1.ListSandboxPreviewsRequest) returns (sandbox.service.v1.ListSandboxPreviewsResponse) {
    option (google.api.http) = { get: "/api/v1/sandbox/{sandbox_id}/ports" };
  }
  rpc GetSandboxPreviewOperation(sandbox.service.v1.GetSandboxPreviewOperationRequest) returns (sandbox.service.v1.SandboxPreviewOperation) {
    option (google.api.http) = { get: "/api/v1/sandbox/{sandbox_id}/port-operations/{operation_id}" };
  }
  rpc CreateSandbox(sandbox.service.v1.CreateSandboxRequest) returns (sandbox.service.v1.SandboxAcceptance) {
    option (google.api.http) = { post: "/api/v1/sandbox" body: "*" };
  }
  rpc ListSandboxes(sandbox.service.v1.ListSandboxesRequest) returns (sandbox.service.v1.ListSandboxesResponse) {
    option (google.api.http) = { get: "/api/v1/sandbox" };
  }
  rpc GetSandbox(sandbox.service.v1.GetSandboxRequest) returns (sandbox.service.v1.Sandbox) {
    option (google.api.http) = { get: "/api/v1/sandbox/{sandbox_id}" };
  }
  rpc GetSandboxOperation(sandbox.service.v1.GetSandboxOperationRequest) returns (sandbox.service.v1.SandboxOperation) {
    option (google.api.http) = { get: "/api/v1/sandbox/operations/{operation_id}" };
  }
  rpc ListSandboxOperations(sandbox.service.v1.ListSandboxOperationsRequest) returns (sandbox.service.v1.ListSandboxOperationsResponse) {
    option (google.api.http) = { get: "/api/v1/sandbox/{sandbox_id}/operations" };
  }
  rpc ListSandboxEnvironment(sandbox.service.v1.ListSandboxEnvironmentRequest) returns (sandbox.service.v1.ListSandboxEnvironmentResponse) {
    option (google.api.http) = { get: "/api/v1/sandbox/{sandbox_id}/environment" };
  }
  rpc GetSandboxEgress(sandbox.service.v1.GetSandboxEgressRequest) returns (sandbox.service.v1.GetSandboxEgressResponse) {
    option (google.api.http) = { get: "/api/v1/sandbox/{sandbox_id}/egress" };
  }
  rpc ListSandboxEvents(sandbox.service.v1.ListSandboxEventsRequest) returns (sandbox.service.v1.ListSandboxEventsResponse) {
    option (google.api.http) = { get: "/api/v1/sandbox/{sandbox_id}/events" };
  }
  rpc ListSandboxSecurityEvents(sandbox.service.v1.ListSandboxSecurityEventsRequest) returns (sandbox.service.v1.ListSandboxSecurityEventsResponse) {
    option (google.api.http) = { get: "/api/v1/sandbox/{sandbox_id}/security-events" };
  }
  rpc ListSandboxCheckpoints(sandbox.service.v1.ListSandboxCheckpointsRequest) returns (sandbox.service.v1.ListSandboxCheckpointsResponse) {
    option (google.api.http) = { get: "/api/v1/sandbox/{sandbox_id}/checkpoints" };
  }
  rpc CreateSandboxCheckpoint(sandbox.service.v1.CreateSandboxCheckpointRequest) returns (sandbox.service.v1.CreateSandboxCheckpointResponse) {
    option (google.api.http) = { post: "/api/v1/sandbox/{data.sandbox_id}/checkpoints" body: "*" };
  }
  rpc CloneSandboxCheckpoint(sandbox.service.v1.CloneSandboxCheckpointRequest) returns (sandbox.service.v1.SandboxAcceptance) {
    option (google.api.http) = { post: "/api/v1/sandbox/{data.source_sandbox_id}/checkpoints/{data.checkpoint_id}:clone" body: "*" };
  }
  rpc RestoreSandboxCheckpoint(sandbox.service.v1.RestoreSandboxCheckpointRequest) returns (sandbox.service.v1.SandboxAcceptance) {
    option (google.api.http) = { post: "/api/v1/sandbox/{data.sandbox_id}/checkpoints/{data.checkpoint_id}:restore" body: "*" };
  }
  rpc GetSandboxMetrics(sandbox.service.v1.GetSandboxMetricsRequest) returns (sandbox.service.v1.SandboxMetricsResponse) {
    option (google.api.http) = { get: "/api/v1/sandbox/{sandbox_id}/metrics" };
  }
  rpc GetSandboxLatestMetrics(sandbox.service.v1.GetSandboxLatestMetricsRequest) returns (sandbox.service.v1.SandboxMetricsResponse) {
    option (google.api.http) = { get: "/api/v1/sandbox/{sandbox_id}/metrics/latest" };
  }
  // HTTP uses a dedicated SSE handler and generation-time OpenAPI description.
  rpc StreamSandboxLogs(sandbox.service.v1.StreamSandboxLogsRequest) returns (stream sandbox.service.v1.StreamSandboxLogsFrame);
  rpc PauseSandbox(sandbox.service.v1.PauseSandboxRequest) returns (sandbox.service.v1.SandboxAcceptance) {
    option (google.api.http) = { post: "/api/v1/sandbox/{data.sandbox_id}:pause" body: "*" };
  }
  rpc ResumeSandbox(sandbox.service.v1.ResumeSandboxRequest) returns (sandbox.service.v1.SandboxAcceptance) {
    option (google.api.http) = { post: "/api/v1/sandbox/{data.sandbox_id}:resume" body: "*" };
  }
  rpc DeleteSandbox(sandbox.service.v1.DeleteSandboxRequest) returns (sandbox.service.v1.SandboxAcceptance) {
    option (google.api.http) = { delete: "/api/v1/sandbox/{data.sandbox_id}" body: "*" };
  }
  rpc RunSandboxCode(sandbox.service.v1.RunSandboxCodeRequest) returns (sandbox.service.v1.SandboxCodeRun) {
    option (google.api.http) = { post: "/api/v1/sandbox/{data.sandbox_id}/code-runs" body: "*" };
  }
  rpc GetSandboxCodeRun(sandbox.service.v1.GetSandboxCodeRunRequest) returns (sandbox.service.v1.SandboxCodeRun) {
    option (google.api.http) = { get: "/api/v1/sandbox/{sandbox_id}/code-runs/{run_id}" };
  }
  rpc ListSandboxFiles(sandbox.service.v1.ListSandboxFilesRequest) returns (sandbox.service.v1.SandboxFileResult) {
    option (google.api.http) = { get: "/api/v1/sandbox/{sandbox_id}/files" };
  }
  rpc ReadSandboxFile(sandbox.service.v1.ReadSandboxFileRequest) returns (sandbox.service.v1.SandboxFileResult) {
    option (google.api.http) = { get: "/api/v1/sandbox/{sandbox_id}/files/content" };
  }
  rpc WriteSandboxFile(sandbox.service.v1.WriteSandboxFileRequest) returns (sandbox.service.v1.SandboxFileOperation) {
    option (google.api.http) = { post: "/api/v1/sandbox/{data.sandbox_id}/files" body: "*" };
  }
  rpc DeleteSandboxFile(sandbox.service.v1.DeleteSandboxFileRequest) returns (sandbox.service.v1.SandboxFileOperation) {
    option (google.api.http) = { delete: "/api/v1/sandbox/{data.sandbox_id}/files" body: "*" };
  }
  rpc GetSandboxFileOperation(sandbox.service.v1.GetSandboxFileOperationRequest) returns (sandbox.service.v1.SandboxFileOperation) {
    option (google.api.http) = { get: "/api/v1/sandbox/{sandbox_id}/file-operations/{operation_id}" };
  }
  rpc CreateSandboxToken(sandbox.service.v1.CreateSandboxTokenRequest) returns (sandbox.service.v1.SandboxAccessToken) {
    option (google.api.http) = { post: "/api/v1/sandbox/{data.sandbox_id}/tokens" body: "*" };
  }
  rpc RevokeSandboxToken(sandbox.service.v1.RevokeSandboxTokenRequest) returns (sandbox.service.v1.RevokeSandboxTokenResponse) {
    option (google.api.http) = { delete: "/api/v1/sandbox/{sandbox_id}/tokens/{token_id}" };
  }
}
