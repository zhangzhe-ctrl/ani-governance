syntax = "proto3";
package admin.service.v1;

import "google/api/annotations.proto";
import "inference/service/v1/owner.proto";

// Requires trusted tenant-user Principal, active tenant and the separately
// registered INFERENCE module/action/role/plan grants. Accelerator read grants
// cannot admit inference commands. CRUD retains the public data envelope.
service InferenceService {
  rpc CreateInference(inference.service.v1.CreateInferenceRequest) returns (inference.service.v1.InferenceAcceptance) {
    option (google.api.http) = {post: "/api/v1/inference/services" body: "*"};
  }
  rpc DeleteInference(inference.service.v1.DeleteInferenceRequest) returns (inference.service.v1.InferenceAcceptance) {
    option (google.api.http) = {post: "/api/v1/inference/services/{data.resource_id}:delete" body: "*"};
  }
}
