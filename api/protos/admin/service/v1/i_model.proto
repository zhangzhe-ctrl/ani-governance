syntax = "proto3";
package admin.service.v1;
import "google/api/annotations.proto";
import "catalog/service/v1/model.proto";
import "gnostic/openapi/v3/annotations.proto";

// Model catalog queries through Governance authentication and authorization.
service ModelService {
  rpc ListModels(catalog.service.v1.ListModelsRequest) returns (catalog.service.v1.ListModelsResponse) {
    option (google.api.http) = { get: "/api/v1/models" };
    option (gnostic.openapi.v3.operation) = {
      summary: "List the authenticated tenant's model catalog"
      description: "Requires login, MODEL subscription and model:catalog:list permission. limit defaults to 100 and must be 1-100. status may be pending, downloading, ready or error. Unknown, empty or repeated query parameters, identity overrides, cursor, keyword, source and capability are rejected. Results are ordered by created_at DESC, id DESC; this is a bounded list without pagination metadata. Platform tenant 0 is denied. Public identity headers are ignored."
      responses: { response_or_reference: [
        { name: "400" value: { response: { description: "Invalid or unsupported query parameter" } } },
        { name: "401" value: { response: { description: "Missing, invalid or revoked login" } } },
        { name: "403" value: { response: { description: "Permission, tenant or subscription denied" } } },
        { name: "503" value: { response: { description: "Model transport, PostgreSQL or internal credentials unavailable" } } },
        { name: "504" value: { response: { description: "Connected Model call exceeded the deadline" } } }
      ] }
    };
  }
}
