syntax = "proto3";

package admin.service.v1;

import "google/api/annotations.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/protobuf/empty.proto";

import "pagination/v1/pagination.proto";
import "access_key/service/v1/access_key.proto";

// OpenAPI 访问凭证（AK/SK）管理 — BFF
service AccessKeyService {
  // 分页查询访问凭证列表
  rpc List (pagination.PagingRequest) returns (access_key.service.v1.ListAccessKeyResponse) {
    option (gnostic.openapi.v3.operation) = { security: { additional_properties: { name: "BearerAuth" value: {} } } };
    option (google.api.http) = { get: "/api/v1/auth/api-keys" };
  }

  // 查询访问凭证详情
  rpc Get (access_key.service.v1.GetAccessKeyRequest) returns (access_key.service.v1.AccessKey) {
    option (gnostic.openapi.v3.operation) = { security: { additional_properties: { name: "BearerAuth" value: {} } } };
    option (google.api.http) = { get: "/api/v1/auth/api-keys/{key_id}" };
  }

  // 创建访问凭证（响应中的 secret_key 仅本次返回，服务端加密存储）
  rpc Create (access_key.service.v1.CreateAccessKeyRequest) returns (access_key.service.v1.CreateAccessKeyResponse) {
    option (gnostic.openapi.v3.operation) = {
      security: { additional_properties: { name: "BearerAuth" value: {} } }
      responses: { response_or_reference: [{ name: "201" value: { response: {
        description: "Created; secret_key is returned once"
        content: { additional_properties: [{ name: "application/json" value: { schema: { reference: { _ref: "#/components/schemas/CreateAccessKeyResponse" } } } }] }
      } } }] }
    };
    option (google.api.http) = {
      post: "/api/v1/auth/api-keys"
      body: "*"
    };
  }

  // 更新访问凭证（名称/状态/过期时间）
  rpc Update (access_key.service.v1.UpdateAccessKeyRequest) returns (google.protobuf.Empty) {
    option (gnostic.openapi.v3.operation) = { security: { additional_properties: { name: "BearerAuth" value: {} } } };
    option (google.api.http) = {
      put: "/api/v1/auth/api-keys/{key_id}"
      body: "*"
    };
  }

  // 删除访问凭证
  rpc Delete (access_key.service.v1.DeleteAccessKeyRequest) returns (access_key.service.v1.DeleteAccessKeyResponse) {
    option (gnostic.openapi.v3.operation) = { security: { additional_properties: { name: "BearerAuth" value: {} } } };
    option (google.api.http) = { delete: "/api/v1/auth/api-keys/{key_id}" };
  }

  // 重置密钥：生成新 Secret（响应明文返回一次）
  rpc ResetSecret (access_key.service.v1.ResetAccessKeySecretRequest) returns (access_key.service.v1.CreateAccessKeyResponse) {
    option (gnostic.openapi.v3.operation) = { security: { additional_properties: { name: "BearerAuth" value: {} } } };
    option (google.api.http) = {
      put: "/api/v1/auth/api-keys/{key_id}/secret"
      body: "*"
    };
  }

}
