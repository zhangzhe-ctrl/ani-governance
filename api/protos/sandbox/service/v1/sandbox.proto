syntax = "proto3";
package sandbox.service.v1;

import "google/protobuf/timestamp.proto";
import "redact/v1/redact.proto";

message ExecSandboxData {
  string sandbox_id = 1 [json_name = "sandbox_id"];
  string idempotency_key = 2 [json_name = "idempotency_key"];
  int64 expected_version = 3 [json_name = "expected_version"];
  int32 rows = 4;
  int32 cols = 5;
}
message ExecSandboxRequest { ExecSandboxData data = 1; }
message ExecSandboxResponse {
  string session_id = 1 [json_name = "session_id"];
  string ws_url = 2 [json_name = "ws_url", (redact.value).string = ""];
  string expires_at = 3 [json_name = "expires_at"];
}

message OpenSandboxPreviewData { string sandbox_id = 1 [json_name="sandbox_id"]; string idempotency_key = 2 [json_name="idempotency_key"]; int64 expected_version = 3 [json_name="expected_version"]; uint32 port = 4; string protocol = 5; uint32 ttl_seconds = 6 [json_name="ttl_seconds"]; }
message OpenSandboxPreviewRequest { OpenSandboxPreviewData data = 1; }
message CloseSandboxPreviewData { string sandbox_id = 1 [json_name="sandbox_id"]; string preview_id = 2 [json_name="preview_id"]; string idempotency_key = 3 [json_name="idempotency_key"]; int64 expected_version = 4 [json_name="expected_version"]; }
message CloseSandboxPreviewRequest { CloseSandboxPreviewData data = 1; }
message ListSandboxPreviewsRequest { string sandbox_id = 1 [json_name="sandbox_id"]; optional uint32 page = 2; optional uint32 page_size = 3 [json_name="pageSize"]; }
message GetSandboxPreviewOperationRequest { string sandbox_id = 1 [json_name="sandbox_id"]; string operation_id = 2 [json_name="operation_id"]; }
message SandboxPreview { string preview_id = 1 [json_name="preview_id"]; string sandbox_id = 2 [json_name="sandbox_id"]; uint32 port = 3; string protocol = 4; string state = 5; string reason = 6; string address = 7; string desired = 8; google.protobuf.Timestamp expires_at = 9 [json_name="expires_at"]; bool replayed = 10; }
message SandboxPreviewAcceptance { SandboxPreview preview = 1; string operation_id = 2 [json_name="operation_id"]; }
message ListSandboxPreviewsResponse { repeated SandboxPreview items = 1; int64 total = 2; }
message SandboxPreviewOperation { string operation_id = 1 [json_name="operation_id"]; string preview_id = 2 [json_name="preview_id"]; string action = 3; string state = 4; string reason = 5; google.protobuf.Timestamp created_at = 6 [json_name="created_at"]; google.protobuf.Timestamp completed_at = 7 [json_name="completed_at"]; }

// Historical and latest metrics cover only the currently identified Pod.
message GetSandboxMetricsRequest {
  string sandbox_id = 1 [json_name = "sandbox_id"];
  string start = 2;
  string end = 3;
  uint32 step = 4;
}
message GetSandboxLatestMetricsRequest { string sandbox_id = 1 [json_name = "sandbox_id"]; }
message SandboxMetricPoint {
  string timestamp = 1;
  optional double value = 2;
  string status = 3;
}
message SandboxMetricSeries {
  string name = 1;
  string unit = 2;
  string status = 3;
  repeated SandboxMetricPoint points = 4;
  string reason = 5;
}
message SandboxMetricsResponse {
  string scope = 1;
  string pod_uid = 2 [json_name = "pod_uid"];
  string start = 3;
  string end = 4;
  uint32 step = 5;
  repeated SandboxMetricSeries series = 6;
  bool history_complete_before_migration = 7 [json_name = "history_complete_before_migration"];
}

message RunSandboxCodeData {
  string sandbox_id = 1 [json_name = "sandbox_id"];
  string idempotency_key = 2 [json_name = "idempotency_key"];
  string language = 3;
  string code = 4 [(redact.value).string = ""];
  string stdin = 5 [(redact.value).string = ""];
  int32 timeout_seconds = 6 [json_name = "timeout_seconds"];
  int64 expected_version = 7 [json_name = "expected_version"];
}
message RunSandboxCodeRequest { RunSandboxCodeData data = 1 [(redact.value).message = { apply: true }]; }
message GetSandboxCodeRunRequest {
  string sandbox_id = 1 [json_name = "sandbox_id"];
  string run_id = 2 [json_name = "run_id"];
}
message SandboxCodeRun {
  string run_id = 1 [json_name = "run_id"];
  string sandbox_id = 2 [json_name = "sandbox_id"];
  string state = 3;
  string stdout = 4 [(redact.value).string = ""];
  string stderr = 5 [(redact.value).string = ""];
  optional int32 exit_code = 6 [json_name = "exit_code"];
  bool truncated = 7;
  bool replayed = 8;
  string reason = 9;
  google.protobuf.Timestamp created_at = 10 [json_name = "created_at"];
  google.protobuf.Timestamp completed_at = 11 [json_name = "completed_at"];
}

message SandboxFileEntry {
  string path = 1;
  string kind = 2;
  int64 size_bytes = 3 [json_name = "size_bytes"];
  int64 updated_at_ns = 4 [json_name = "updated_at_ns"];
  string updated_at = 5 [json_name = "updated_at"];
}
message SandboxFileResult {
  string path = 1;
  string kind = 2;
  int64 size_bytes = 3 [json_name = "size_bytes"];
  string content_base64 = 4 [(redact.value).string = "", json_name = "content_base64"];
  repeated SandboxFileEntry items = 5;
  int64 total = 6;
  string next_cursor = 7 [json_name = "next_cursor"];
}
message ListSandboxFilesRequest { string sandbox_id = 1 [json_name = "sandbox_id"]; string path = 2; uint32 limit = 3; string cursor = 4; optional uint32 page = 5; optional uint32 page_size = 6 [json_name = "pageSize"]; }
message ReadSandboxFileRequest { string sandbox_id = 1 [json_name = "sandbox_id"]; string path = 2; }
message MutateSandboxFileData {
  string sandbox_id = 1 [json_name = "sandbox_id"];
  string idempotency_key = 2 [json_name = "idempotency_key"];
  int64 expected_version = 3 [json_name = "expected_version"];
  string path = 4;
  string content_base64 = 5 [(redact.value).string = "", json_name = "content_base64"];
  bool overwrite = 6;
}
message WriteSandboxFileRequest { MutateSandboxFileData data = 1 [(redact.value).message = { apply: true }]; }
message DeleteSandboxFileRequest { MutateSandboxFileData data = 1 [(redact.value).message = { apply: true }]; }
message GetSandboxFileOperationRequest { string sandbox_id = 1 [json_name = "sandbox_id"]; string operation_id = 2 [json_name = "operation_id"]; }
message SandboxFileOperation {
  string operation_id = 1 [json_name = "operation_id"];
  string sandbox_id = 2 [json_name = "sandbox_id"];
  string state = 3;
  string reason = 4;
  bool replayed = 5;
  SandboxFileResult result = 6 [(redact.value).message = { apply: true }];
}

message CreateSandboxTokenData {
  string sandbox_id = 1 [json_name = "sandbox_id"];
  string idempotency_key = 2 [json_name = "idempotency_key"];
  string expires_in = 3 [json_name = "expires_in"];
  repeated string scopes = 4;
}
message CreateSandboxTokenRequest { CreateSandboxTokenData data = 1; }
message SandboxAccessToken {
  string token_id = 1 [json_name = "token_id"];
  string token = 2 [(redact.value).string = ""];
  google.protobuf.Timestamp expires_at = 3 [json_name = "expires_at"];
  repeated string scopes = 4;
  bool replayed = 5;
}
message RevokeSandboxTokenRequest { string sandbox_id = 1 [json_name = "sandbox_id"]; string token_id = 2 [json_name = "token_id"]; }
message RevokeSandboxTokenResponse { bool revoked = 1; }

message SandboxEgressIntent { string network_egress_policy = 1 [json_name = "network_egress_policy"]; repeated string egress_allowlist = 2 [json_name = "egress_allowlist"]; }
message CreateSandboxData {
  string idempotency_key = 1 [json_name = "idempotency_key"];
  string name = 2;
  string image_reference = 3 [json_name = "image_reference"];
  string preset_id = 4 [json_name = "preset_id"];
  string workspace_size = 5 [json_name = "workspace_size"];
  string instance_id = 6 [json_name = "instance_id", deprecated = true];
  string image_id = 7 [json_name = "image_id"];
  string image_scope = 8 [json_name = "image_scope"];
  SandboxEgressIntent egress_intent = 9 [json_name = "egress_intent"];
}
message CreateSandboxRequest { CreateSandboxData data = 1; }
message SandboxAcceptance {
  string operation_id = 1 [json_name = "operation_id"];
  string resource_id = 2 [json_name = "resource_id"];
  bool accepted = 3;
  bool replayed = 4;
  string intent_enforcement = 5 [json_name = "intent_enforcement"];
}
message GetSandboxRequest { string instance_id = 1 [json_name = "instance_id", deprecated = true]; string sandbox_id = 2 [json_name = "sandbox_id"]; }
message ListSandboxesRequest {
  string instance_id = 1 [json_name = "instance_id", deprecated = true];
  optional uint32 page = 2;
  optional uint32 page_size = 3 [json_name = "pageSize"];
}
message Sandbox {
  string id = 1;
  string instance_id = 2 [json_name = "instance_id", deprecated = true];
  int64 version = 3;
  string desired_state = 4 [json_name = "desired_state"];
  string observed_state = 5 [json_name = "observed_state"];
  string reason = 6;
  string create_operation_id = 7 [json_name = "create_operation_id"];
  string last_operation_id = 8 [json_name = "last_operation_id"];
  SandboxSnapshot snapshot = 9;
  ProviderRefs provider_refs = 10 [json_name = "provider_refs"];
  google.protobuf.Timestamp observed_at = 11 [json_name = "observed_at"];
}
message SandboxSnapshot {
  string name = 1;
  string image_reference = 2 [json_name = "image_reference"];
  string preset_id = 3 [json_name = "preset_id"];
  string image_digest = 4 [json_name = "image_digest"];
  int64 cpu_millis = 5 [json_name = "cpu_millis"];
  int64 memory_mib = 6 [json_name = "memory_mib"];
  string compute_type = 7 [json_name = "compute_type"];
  string cluster_id = 8 [json_name = "cluster_id"];
  string namespace = 9;
  string runtime_class = 10 [json_name = "runtime_class"];
  string selection_digest = 11 [json_name = "selection_digest"];
  string preset_code = 12 [json_name = "preset_code"];
  string preset_name = 13 [json_name = "preset_name"];
  string spec_digest = 14 [json_name = "spec_digest"];
  WorkspaceSpec workspace = 15;
  string image_id = 16 [json_name = "image_id"];
  string image_scope = 17 [json_name = "image_scope"];
}
message WorkspaceSpec {
  string mount_path = 1 [json_name = "mount_path"];
  string size = 2;
  string storage_class = 3 [json_name = "storage_class"];
  string reclaim_policy = 4 [json_name = "reclaim_policy"];
}
message ProviderRefs {
  string pvc_name = 1 [json_name = "pvc_name"];
  string pvc_uid = 2 [json_name = "pvc_uid"];
  string pod_name = 3 [json_name = "pod_name"];
  string pod_uid = 4 [json_name = "pod_uid"];
  string resource_version = 5 [json_name = "resource_version"];
  string cleanup_receipt = 6 [json_name = "cleanup_receipt"];
  string pvc_resource_version = 7 [json_name = "pvc_resource_version"];
  string pod_resource_version = 8 [json_name = "pod_resource_version"];
  string pv_name = 9 [json_name = "pv_name"];
  string pv_uid = 10 [json_name = "pv_uid"];
}
message GetSandboxResponse { Sandbox sandbox = 1; }
message ListSandboxesResponse { repeated Sandbox items = 1; int64 total = 2; }
message SandboxActionData {
  string sandbox_id = 1 [json_name = "sandbox_id"];
  string idempotency_key = 2 [json_name = "idempotency_key"];
  int64 expected_version = 3 [json_name = "expected_version"];
  string instance_id = 4 [json_name = "instance_id", deprecated = true];
}
message PauseSandboxRequest { SandboxActionData data = 1; }
message ResumeSandboxRequest { SandboxActionData data = 1; }
message DeleteSandboxRequest { SandboxActionData data = 1; }
message GetSandboxOperationRequest { string instance_id = 1 [json_name = "instance_id", deprecated = true]; string operation_id = 2 [json_name = "operation_id"]; }
message ListSandboxOperationsRequest { string sandbox_id = 1 [json_name = "sandbox_id"]; optional uint32 page = 2; optional uint32 page_size = 3 [json_name = "pageSize"]; }
message ListSandboxOperationsResponse { repeated SandboxOperationHistoryItem items = 1; int64 total = 2; }
message ListSandboxEnvironmentRequest { string sandbox_id = 1 [json_name = "sandbox_id"]; optional uint32 page = 2; optional uint32 page_size = 3 [json_name = "pageSize"]; }
message SandboxEnvironmentVariable { string name = 1; string source = 2; string secret_ref = 3 [json_name = "secret_ref"]; string field_ref = 4 [json_name = "field_ref"]; }
message ListSandboxEnvironmentResponse { repeated SandboxEnvironmentVariable items = 1; int64 total = 2; }
message GetSandboxEgressRequest { string sandbox_id = 1 [json_name = "sandbox_id"]; }
message SandboxEgressLabelExpression { string key = 1; string operator = 2; repeated string values = 3; }
message SandboxEgressSelector { map<string,string> match_labels = 1 [json_name = "match_labels"]; repeated SandboxEgressLabelExpression match_expressions = 2 [json_name = "match_expressions"]; }
message SandboxEgressIPBlock { string cidr = 1; repeated string except = 2; }
message SandboxEgressPeer { SandboxEgressSelector pod_selector = 1 [json_name = "pod_selector"]; SandboxEgressSelector namespace_selector = 2 [json_name = "namespace_selector"]; SandboxEgressIPBlock ip_block = 3 [json_name = "ip_block"]; }
message SandboxEgressPort { string protocol = 1; string port_type = 2 [json_name = "port_type"]; string port = 3; int32 end_port = 4 [json_name = "end_port"]; }
message SandboxEgressRule { repeated SandboxEgressPeer peers = 1; repeated SandboxEgressPort ports = 2; }
message GetSandboxEgressResponse { string source = 1; string declaration = 2; string enforcement = 3; bool host_allowlist_known = 4 [json_name = "host_allowlist_known"]; bool isolated = 5; repeated SandboxEgressRule rules = 6; string host_allowlist_status = 7 [json_name = "host_allowlist_status"]; SandboxEgressIntent intent = 8; string intent_enforcement = 9 [json_name = "intent_enforcement"]; }
message ListSandboxEventsRequest { string sandbox_id = 1 [json_name = "sandbox_id"]; optional uint32 page = 2; optional uint32 page_size = 3 [json_name = "pageSize"]; }
message SandboxEvent { string id = 1; string occurred_at = 2 [json_name = "occurred_at"]; string type = 3; string reason = 4; string message = 5; }
message ListSandboxEventsResponse { repeated SandboxEvent items = 1; int64 total = 2; string scope = 3; bool history_complete_before_migration = 4 [json_name = "history_complete_before_migration"]; }
message ListSandboxSecurityEventsRequest { string sandbox_id = 1 [json_name = "sandbox_id"]; optional uint32 page = 2; optional uint32 page_size = 3 [json_name = "pageSize"]; string severity = 4; }
message SandboxSecurityEvent { string id = 1; string occurred_at = 2 [json_name = "occurred_at"]; string severity = 3; string event_type = 4 [json_name = "event_type"]; string description = 5; }
message ListSandboxSecurityEventsResponse { repeated SandboxSecurityEvent items = 1; int64 total = 2; string source = 3; bool history_complete_before_migration = 4 [json_name = "history_complete_before_migration"]; }
message ListSandboxCheckpointsRequest { string sandbox_id = 1 [json_name = "sandbox_id"]; optional uint32 page = 2; optional uint32 page_size = 3 [json_name = "pageSize"]; }
message SandboxCheckpoint { string id = 1; string name = 2; string status = 3; string reason = 4; string scope = 5; int64 size_bytes = 6 [json_name = "size_bytes"]; bool size_known = 7 [json_name = "size_known"]; string created_at = 8 [json_name = "created_at"]; string provider_status = 9 [json_name = "provider_status"]; }
message ListSandboxCheckpointsResponse { repeated SandboxCheckpoint items = 1; int64 total = 2; string source = 3; }
message CreateSandboxCheckpointData { string sandbox_id = 1 [json_name = "sandbox_id"]; string name = 2; string idempotency_key = 3 [json_name = "idempotency_key"]; int64 expected_version = 4 [json_name = "expected_version"]; }
message CreateSandboxCheckpointRequest { CreateSandboxCheckpointData data = 1; }
message CreateSandboxCheckpointResponse { string checkpoint_id = 1 [json_name = "checkpoint_id"]; string operation_id = 2 [json_name = "operation_id"]; string state = 3; bool replayed = 4; }
// Cloning creates a separate Sandbox. Source identity is bound into the
// durable command; the destination does not depend on an Instance resource.
message CloneSandboxCheckpointData {
  string source_sandbox_id = 1 [json_name = "source_sandbox_id"];
  string checkpoint_id = 2 [json_name = "checkpoint_id"];
  string idempotency_key = 3 [json_name = "idempotency_key"];
  int64 expected_version = 4 [json_name = "expected_version"];
  string name = 5;
  string preset_id = 6 [json_name = "preset_id"];
  string workspace_size = 7 [json_name = "workspace_size"];
  string image_id = 8 [json_name = "image_id"];
  string image_scope = 9 [json_name = "image_scope"];
  string image_reference = 10 [json_name = "image_reference"];
  SandboxEgressIntent egress_intent = 11 [json_name = "egress_intent"];
}
message CloneSandboxCheckpointRequest { CloneSandboxCheckpointData data = 1; }
message RestoreSandboxCheckpointData {
  string sandbox_id = 1 [json_name = "sandbox_id"];
  string checkpoint_id = 2 [json_name = "checkpoint_id"];
  string idempotency_key = 3 [json_name = "idempotency_key"];
  int64 expected_version = 4 [json_name = "expected_version"];
}
message RestoreSandboxCheckpointRequest { RestoreSandboxCheckpointData data = 1; }
message StreamSandboxLogsRequest { string sandbox_id = 1 [json_name = "sandbox_id"]; optional uint32 tail_lines = 2; optional bool follow = 3; string since_time = 4 [json_name = "since_time"]; string pod_uid = 5 [json_name = "pod_uid"]; }
message StreamSandboxLogsFrame { string kind = 1; bytes data = 2; string reason = 3; string pod_uid = 4 [json_name = "pod_uid"]; }
message SandboxOperationHistoryItem {
  string operation_id = 1 [json_name = "operation_id"];
  string sandbox_id = 2 [json_name = "sandbox_id"];
  string action = 3;
  string state = 4;
  string reason = 5;
  google.protobuf.Timestamp created_at = 6 [json_name = "created_at"];
  google.protobuf.Timestamp completed_at = 7 [json_name = "completed_at"];
}
message SandboxOperation {
  string id = 1;
  string sandbox_id = 2 [json_name = "sandbox_id"];
  string instance_id = 3 [json_name = "instance_id", deprecated = true];
  string action = 4;
  int64 intent_version = 5 [json_name = "intent_version"];
  string state = 6;
  string reason = 7;
  google.protobuf.Timestamp created_at = 8 [json_name = "created_at"];
  google.protobuf.Timestamp completed_at = 9 [json_name = "completed_at"];
}
