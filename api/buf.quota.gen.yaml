version: v2
clean: false
managed:
  enabled: true
  disable:
    - module: buf.build/googleapis/googleapis
    - module: buf.build/gnostic/gnostic
    - module: buf.build/tx7do/pagination
    - module: buf.build/envoyproxy/protoc-gen-validate
    - module: buf.build/go-wind/redact
    - module: buf.build/kratos/apis
    - module: buf.build/gogo/protobuf
  override:
    - file_option: go_package_prefix
      value: go-wind-admin/api/gen/go
    - file_option: go_package
      path: admin/service/v1
      value: go-wind-admin/api/gen/go/admin/service/v1;adminpb
    - file_option: go_package
      path: identity/service/v1
      value: go-wind-admin/api/gen/go/identity/service/v1;identitypb
    - file_option: go_package
      path: quota/service/v1
      value: go-wind-admin/api/gen/go/quota/service/v1;quotapb
inputs:
  - directory: protos
    paths:
      - protos/quota/service/v1/quota_catalog.proto
      - protos/quota/service/v1/quota_release.proto
      - protos/admin/service/v1/i_quota.proto
      - protos/identity/service/v1/plan_quota.proto
      - protos/identity/service/v1/tenant.proto
plugins:
  - local: [go, run, google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11]
    out: gen/go
    opt: paths=source_relative
  - local: [go, run, google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.0]
    out: gen/go
    opt: paths=source_relative
  - local: [go, run, github.com/go-kratos/kratos/cmd/protoc-gen-go-http/v2@v2.0.0-20251205160234-b9fab9a5a5ab]
    out: gen/go
    opt: paths=source_relative
