version: v2
clean: false
managed:
  enabled: true
  disable:
    - module: buf.build/googleapis/googleapis
    - module: buf.build/gnostic/gnostic
    - module: buf.build/tx7do/pagination
    - module: buf.build/envoyproxy/protoc-gen-validate
    - module: buf.build/go-wind/redact
    - module: buf.build/kratos/apis
    - module: buf.build/gogo/protobuf
  override:
    - file_option: go_package_prefix
      value: go-wind-admin/api/gen/go
    - file_option: go_package
      path: admin/service/v1
      value: go-wind-admin/api/gen/go/admin/service/v1;adminpb
    - file_option: go_package
      path: access_key/service/v1
      value: go-wind-admin/api/gen/go/access_key/service/v1;accesskeypb
    - file_option: go_package
      path: authentication/service/v1
      value: go-wind-admin/api/gen/go/authentication/service/v1;authenticationpb
    - file_option: go_package
      path: audit/service/v1
      value: go-wind-admin/api/gen/go/audit/service/v1;auditpb
    - file_option: go_package
      path: identity/service/v1
      value: go-wind-admin/api/gen/go/identity/service/v1;identitypb
inputs:
  - directory: protos
    paths:
      - protos/admin/service/v1/i_access_key.proto
      - protos/access_key/service/v1/access_key.proto
      - protos/authentication/service/v1/ani_auth.proto
      - protos/audit/service/v1/api_audit_log.proto
      - protos/admin/service/v1/i_network.proto
      - protos/catalog/service/v1/vpc.proto
      - protos/identity/service/v1/module.proto
plugins:
  - local: [go, run, google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11]
    out: gen/go
    opt: paths=source_relative
  - local: [go, run, google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.0]
    out: gen/go
    opt: paths=source_relative
  - local: [go, run, github.com/go-kratos/kratos/cmd/protoc-gen-go-http/v2@v2.0.0-20251205160234-b9fab9a5a5ab]
    out: gen/go
    opt: paths=source_relative
  - local: [go, run, github.com/envoyproxy/protoc-gen-validate@v1.3.3]
    out: gen/go
    opt:
      - paths=source_relative
      - lang=go
