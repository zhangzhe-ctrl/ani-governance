title = "Governance reviewed fixture and digest exceptions"
[extend]
useDefault = true

[[rules]]
id = "private-key"
[[rules.allowlists]]
description = "Pre-existing development RSA fixture; both complete files are SHA256-locked by verify-gpu-audit and production rejects this key"
condition = "AND"
paths = ['''^app/admin/service/configs/auth\.yaml$''', '''^app/admin/service/internal/data/authenticator_test\.go$''']
regexes = ['''(?s)^-----BEGIN (RSA )?PRIVATE KEY-----.*-----END (RSA )?PRIVATE KEY-----$''']

[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Historical source/table checksum evidence, not credentials"
condition = "AND"
paths = ['''^docs/evidence/aksk-vpc-20260922/(source-manifest|restart-snapshot)\.json$''']
regexes = ['''^[0-9a-f]{32}$''', '''^[0-9a-f]{64}$''']
[[rules.allowlists]]
description = "Fingerprint used to reject the known development RSA example"
condition = "AND"
paths = ['''^app/admin/service/internal/data/authenticator\.go$''']
regexes = ['''^MIIEvQIBADANBgkqhkiG9w0BAQEFAASCBKcwggSjAgEAAoIBAQCL8EdeTLDTf8AY$''']
[[rules.allowlists]]
description = "Literal API example repeated in unit test and documentation"
condition = "AND"
paths = ['''^pkg/crypto/(payload_test\.go|README\.md)$''']
regexes = ['''^sk-1234567890abcdef$''']
[[rules.allowlists]]
description = "Documented test cursor key, decoded text explicitly starts test-signing-key"
condition = "AND"
paths = ['''^docs/local-integration\.md$''']
regexes = ['''^dGVzdC1zaWduaW5nLWtleS0wMTIzNDU2Nzg5YWJjZGVmMDEyMzQ1Njc4OWFiY2RlZg==$''', '''^test-signing-key-0123456789abcdef0123456789abcdef$''']
[[rules.allowlists]]
description = "Case identifier incorrectly parsed as API credential"
condition = "AND"
paths = ['''^scripts/model-lab/collect\.py$''']
regexes = ['''^V12-inventory-permission-route$''']
[[rules.allowlists]]
description = "Expected signature digest in the fixed example-key signing vector"
condition = "AND"
paths = ['''^scripts/test_aksk_vpc_client\.py$''']
regexes = ['''^vpc_0123456789abcdef0123456789abcdef$''']
[[rules.allowlists]]
description = "T05 evidence-file checksum recorded by the migration ledger: the value is the SHA-256 of migration/patches/T05/_orig/kratos-authn-engine-metadata.go, i.e. a digest of repository content under a key that names the file, not a credential"
condition = "AND"
regexTarget = "secret"
paths = ['''^migration/handoff\.json$''']
regexes = ['''^b7907194f4ef659c11c90773305d7589c440f30a1757c0f8a06b0305edaf827d$''']
[[rules.allowlists]]
description = "Pagination cursor examples in the taken-over go-crud/pagination README: both decode to a two-field JSON id (100 and 200) and are printed by the documented example, not used as credentials"
condition = "AND"
regexTarget = "secret"
paths = ['''^pkg/localdeps/go-crud/pagination/README\.md$''']
regexes = ['''^eyJpZCI6MTAwfQ==$''', '''^eyJpZCI6MjAwfQ==$''']
[[rules.allowlists]]
description = "T14 `go version -m` buildinfo dumps. The matched string is the public Go module dirhash of github.com/getkin/kin-openapi v0.149.0: byte-identical to go.sum:140 and to what `go mod verify` checks, so it is a dependency content digest recorded on a line that names the module and version, not a credential. The scanner itself exempts the identical content by file name (a copy of go.sum is clean, a copy renamed other.txt is reported), which is the false-positive proof. Negative controls with this exception loaded: the same line under any other path is still reported, and a different h1 value appended inside these paths is still reported (scripts/gitleaks-buildinfo-exception.sh)."
condition = "AND"
regexTarget = "secret"
paths = ['''^migration/patches/T14/buildinfo/admin\.txt$''', '''^migration/patches/T14/buildinfo/server\.txt$''']
regexes = ['''^ZbhmVJ4yq5RZDUsyP8lcBcGMsjsaTqXEFt6isdtMDfA=$''']

[[rules]]
id = "jwt"
[[rules.allowlists]]
description = "Expected token asserted by the taken-over kratos-authn jwt engine test, signed with the literal key \"test\" created two lines above it in the same file; the string appears nowhere else in the repository and no runtime path loads it"
condition = "AND"
regexTarget = "secret"
paths = ['''^pkg/localdeps/kratos-authn/engine/jwt/jwt_test\.go$''']
regexes = ['''^eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJzY29wZSI6WyJsb2NhbDphZG1pbjp1c2VyX25hbWUiLCJ0ZW5hbnQ6YWRtaW46dXNlcl9uYW1lIl0sInN1YiI6InVzZXJfbmFtZSJ9\.xIzbQbQSlzdms5ZVaHrg6pZohDlt0DTYopobUo2qqQw$''']
[[rules.allowlists]]
description = "Public jwt.io documentation sample carried by the taken-over SSE browser demo page: the header is alg=HS256/typ=JWT, the payload decodes to sub=1234567890, name=\"John Doe\", admin=true, iat=1516239022, and it is signed with the publicly published demo key. The page only points a browser EventSource at localhost:8800; no service in this repository issues or accepts this token."
condition = "AND"
regexTarget = "secret"
paths = ['''^pkg/localdeps/kratos-transport/transport/sse/index\.html$''']
regexes = ['''^eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiYWRtaW4iOnRydWUsImlhdCI6MTUxNjIzOTAyMn0\.KMUFsIDTnFmyG3nMiGM6H9FNFUROf3wh7SmqJp-QV30$''']
